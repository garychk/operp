name: '流水线-202608132144'
displayName: '流水线-202608132144'
triggers:
  push:
    branches:
      - main
      - master
      - dev
  pr:
    branches:
      - main
      - master
      - dev
stages:
  - name: stage-01
    displayName: 测试
    strategy: naturally
    trigger: auto
    executor:
      - default
    steps:
      - step: test@nodejs
        name: test_0
        displayName: Nodejs 测试
        nodeVersion: 24.13.0   # 已修改
        commands:
          - npm config set registry https://registry.npmmirror.com
          - npm install && npm run test
        caches: []
        disable: false
        alwaysRun: false
        timeout: 60
        retry: {}
  - name: stage-02
    displayName: 编译
    strategy: naturally
    trigger: auto
    executor:
      - default
    steps:
      - step: build@nodejs
        name: _1
        displayName: Nodejs 编译
        nodeVersion: 24.13.0   # 已修改
        commands:
          - npm config set registry https://registry.npmmirror.com
          - npm install && npm run build
        caches: []
        disable: false
        alwaysRun: false
        timeout: 60
        retry: {}
  - name: stage-03
    displayName: 发布
    strategy: naturally
    trigger: auto
    executor:
      - default
    steps: []
  - name: stage-04
    displayName: 部署
    strategy: naturally
    trigger: auto
    executor:
      - default
    steps: []