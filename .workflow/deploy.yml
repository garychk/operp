# ========================================================
# master 分支自动发布流水线
# 功能：push 到 master -> 云端构建 dist -> SSH 同步到服务器 -> 重启 nginx 容器
#
# 需要在 Gitee 仓库网页端配置密钥环境变量（Gitee Go -> 流水线设置 -> 环境变量管理）：
#   SSH_HOST        服务器 IP 或域名
#   SSH_PORT        SSH 端口（默认 22）
#   SSH_USER        SSH 用户名（需有 docker 权限）
#   SSH_PRIVATE_KEY SSH 私钥内容（对应服务器上 authorized_keys 中的公钥）
#   DEPLOY_DIR      服务器部署目录（如 /opt/operp）
# ========================================================
version: '1.0'
name: deploy-master
displayName: 'master 自动发布'
triggers:
  push:
    - matchType: PRECISE
      branch: master
      commitMessage: ''
stages:
  - stage:
      name: build-stage
      displayName: '构建'
      failFast: false
      steps:
        - step: npmbuild@1
          name: npm-build
          displayName: 'npm 构建'
          inputs:
            nodeVersion: 20
            goals: |
              set -e
              npm config set registry https://registry.npmmirror.com
              npm install
              npm run build
              ls -la dist/
  - stage:
      name: deploy-stage
      displayName: '部署'
      failFast: false
      steps:
        - step: npmbuild@1
          name: ssh-deploy
          displayName: 'SSH 同步并重启容器'
          inputs:
            nodeVersion: 20
            goals: |
              set -e
              echo "== 配置 SSH 密钥 =="
              mkdir -p ~/.ssh
              printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
              chmod 600 ~/.ssh/id_rsa
              ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

              echo "== 打包构建产物 =="
              tar czf deploy.tar.gz dist docker-compose.yml nginx.conf

              echo "== 上传到服务器 =="
              scp -P "$SSH_PORT" deploy.tar.gz "$SSH_USER@$SSH_HOST:/tmp/operp-deploy.tar.gz"

              echo "== 服务器端解压并重启容器 =="
              ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "set -e
                mkdir -p '$DEPLOY_DIR'
                tar xzf /tmp/operp-deploy.tar.gz -C '$DEPLOY_DIR'
                rm -f /tmp/operp-deploy.tar.gz
                cd '$DEPLOY_DIR'
                docker compose up -d --force-recreate
                docker image prune -f || true
                echo '== 部署完成 =='
                docker ps --filter name=operp-web"
