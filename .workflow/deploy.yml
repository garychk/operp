# ========================================================
# master 分支自动发布流水线
# 功能：push 到 master -> 云端构建 dist -> 上传制品 -> 部署到自有主机(主机组 operp) -> 重启 nginx 容器
# 结构参照 .workflow/流水线-202608132225.yml（图形视图导出的当前版格式）
#
# 前提：
#   1. 服务器已安装 Gitee Go 主机 Agent 并注册到主机组 operp
#   2. 服务器已装 Docker，部署用户有 docker 权限
#   3. 制品解压目录为 ~/gitee_go/deploy（含 dist/ docker-compose.yml nginx.conf）
# ========================================================
version: "1.0"
name: deploy-master
displayName: master 自动发布
stages:
- name: 构建
  displayName: 构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: build
    displayName: Nodejs 构建
    nodeVersion: 20
    commands:
    - '# 设置NPM源，提升安装速度'
    - npm config set registry https://registry.npmmirror.com
    - '# 安装依赖并构建'
    - npm install && npm run build
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - ./dist
      - ./docker-compose.yml
      - ./nginx.conf
      type: .tar.gz
    caches:
    - "~/.npm"
    - "~/.yarn"
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 上传
  displayName: 上传
  strategy: naturally
  trigger: auto
  steps:
  - step: publish@general_artifacts
    name: upload
    displayName: 上传制品
    dependArtifact: BUILD_ARTIFACT
    artifactName: output
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 部署
  displayName: 部署
  strategy: naturally
  trigger: auto
  steps:
  - step: deploy@agent
    name: deploy
    displayName: 主机部署
    deployArtifact:
    - name: output
      target: "~/gitee_go/deploy"
      source: artifact
      dependArtifact: ""
      artifactRepository: default
      artifactName: output
      artifactVersion: latest
    script: |-
      set -e
      cd ~/gitee_go/deploy
      echo "== 当前目录内容 =="
      ls -la
      echo "== 重启 nginx 容器 =="
      docker compose up -d --force-recreate
      docker ps --filter name=operp-web
      echo "== 部署完成 =="
    hostGroupID:
      ID: operp
      hostID:
      - 4a269803-6151-46dd-9728-16b6706f694d
    notify: []
    strategy:
      retry: "0"
triggers:
  push:
    branches:
      precise:
      - master
notify: []
strategy:
  blocking: true
