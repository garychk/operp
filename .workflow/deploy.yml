version: "1.0"
name: deploy-master
displayName: master 自动发布
stages:
- name: 构建
  displayName: 构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: build
    displayName: Nodejs 构建
    nodeVersion: 20.19.0
    commands:
    - '# 诊断：确认 node 环境'
    - node -v && npm -v
    - '# 设置NPM源，提升安装速度'
    - npm config set registry https://registry.npmmirror.com
    - '# 安装依赖并构建'
    - npm install && npm run build
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - ./dist
      - ./docker-compose.yml
      - ./nginx.conf
      type: .tar.gz
    caches:
    - "~/.npm"
    - "~/.yarn"
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 上传
  displayName: 上传
  strategy: naturally
  trigger: auto
  steps:
  - step: publish@general_artifacts
    name: upload
    displayName: 上传制品
    dependArtifact: BUILD_ARTIFACT
    artifactName: output
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 部署
  displayName: 部署
  strategy: naturally
  trigger: auto
  steps:
  - step: deploy@agent
    name: deploy
    displayName: 主机部署
    deployArtifact:
    - name: output
      target: "~/gitee_go/deploy"
      source: artifact
      dependArtifact: ""
      artifactRepository: default
      artifactName: output
      artifactVersion: latest
    script: |-
      set -e
      cd ~/gitee_go/deploy
      echo "== 当前目录内容 =="
      ls -la

      # 制品以 output.tar.gz 形式下载，需要先解压
      if [ -f output.tar.gz ]; then
        echo "== 解压制品 output.tar.gz =="
        tar -xzf output.tar.gz
        echo "== 解压后内容 =="
        ls -la
      fi

      # 定位 docker-compose.yml / compose.yml（可能直接在当前目录，也可能在子目录）
      COMPOSE_DIR=$(find . -maxdepth 3 \( -name docker-compose.yml -o -name compose.yml \) -print -quit 2>/dev/null | xargs -r dirname)
      if [ -z "$COMPOSE_DIR" ]; then
        echo "错误：未找到 docker-compose.yml / compose.yml"
        echo "请确认制品已包含该文件，且解压后目录结构符合预期。"
        exit 1
      fi
      cd "$COMPOSE_DIR"

      if [ ! -f nginx.conf ]; then
        echo "错误：未找到 nginx.conf，Nginx 容器将无法加载站点配置。"
        exit 1
      fi

      echo "== 重启 nginx 容器 =="
      docker compose up -d --force-recreate
      docker ps --filter name=operp-web
      echo "== 部署完成 =="
    hostGroupID:
      ID: operp
      hostID:
      - 4a269803-6151-46dd-9728-16b6706f694d
    notify: []
    strategy:
      retry: "0"
triggers:
  trigger: auto
  push:
    branches:
      prefix: []
      precise:
      - master
      include: []
notify: []
strategy:
  blocking: true
