# HTTP：ACME 校验必须走明文，其余全部跳 HTTPS
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name operp.oplug.cn;

  # Let's Encrypt HTTP-01 校验。不能 301，否则续期会失败。
  # 对应宿主机目录 ./certbot-webroot，挂载到 /var/www/certbot
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name operp.oplug.cn;

  # 证书由 scripts/issue-cert.sh 写入宿主机 ./certs，挂载到 /etc/nginx/certs
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # HSTS。若要停用 HTTPS 必须先撤掉这个头，否则浏览器会强制跳转半年。
  add_header Strict-Transport-Security "max-age=15768000" always;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://ai-server:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|mjs|map|ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
    expires 30d;
    # add_header 在子块会覆盖父块，所以 HSTS 要在这里再写一次
    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
    try_files $uri =404;
  }
}
